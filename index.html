            <div class="toolbar">
                <button class="btn btn-primary" @click="$refs.fileInput.click()">
                    <i class="fas fa-upload"></i>
                    Upload
                </button>
                
                <div class="divider" x-show="imageLoaded"></div>
                
                <button class="btn" @click="$refs.pngOverlayInput.click()" x-show="imageLoaded">
                    <i class="fas fa-image"></i>
                    Add PNG
                </button>
                
                <button class="btn" 
                        :class="{ 'btn-primary': addTextMode }"
                        @click="addTextElement()" 
                        x-show="imageLoaded">
                    <i class="fas fa-font"></i>
                    <span x-text="addTextMode ? 'Click to Place Text' : 'Add Text'"></span>
                </button>
                
                <div class="divider" x-show="imageLoaded"></div>
                
                <button class="btn" @click="$refs.coordsInput.click()" x-show="imageLoaded">
                    <i class="fas fa-file-import"></i>
                    Load
                </button>
                
                <button class="btn" @click="downloadCoordinates()" x-show="imageLoaded && hasAnnotationsInDocument">
                    <i class="fas fa-file-download"></i>
                    Save
                </button>
                
                <div class="divider" x-show="imageLoaded"></div>
                
                <label style="font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px;" x-show="imageLoaded">
                    Numbering:
                    <select x-model="numberingMode" @change="handleNumberingModeChange()" class="select-input">
                        <option value="continuous">Continue Across Pages</option>
                        <option value="restart">Restart On Each Page</option>
                    </select>
                </label>
                
                <label style="font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px;" x-show="imageLoaded">
                    Size:
                    <input type="number" x-model.number="markerSize" min="10" max="100" step="5" class="size-input">
                </label>
                
                <div class="page-nav" x-show="pageCount > 1">
                    <button class="btn" @click="goToPreviousPage()" :disabled="currentPageIndex === 0 || isExporting">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="page-indicator" x-text="`Page ${currentPageNumber} / ${pageCount}`"></div>
                    <button class="btn" @click="goToNextPage()" :disabled="currentPageIndex >= pageCount - 1 || isExporting">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <button class="btn" @click="undo()" :disabled="!canUndo" x-show="imageLoaded">
                    <i class="fas fa-undo"></i>
                </button>
                
                <button class="btn" @click="redo()" :disabled="!canRedo" x-show="imageLoaded">
                    <i class="fas fa-redo"></i>
                </button>
                
                <button class="btn" @click="clearAllMarkers()" x-show="imageLoaded && hasAnnotationsOnCurrentPage">
                    <i class="fas fa-trash"></i>
                    Clear
                </button>
                
                <div class="divider" x-show="imageLoaded"></div>
                
                <button class="btn btn-primary" @click="openDownloadModal()" x-show="imageLoaded">
                    <i class="fas fa-download"></i>
                    Download
                </button>
            </div>
        </div>
        
        <!-- Canvas Area -->
        <div class="canvas-container">
            <!-- Rulers -->
            <div class="ruler-corner" x-show="imageLoaded">
                <i class="fas fa-ruler-combined"></i>
            </div>
            
            <div class="ruler-horizontal" x-show="imageLoaded" x-ref="rulerH">
                <template x-for="i in 100" :key="'h'+i">
                    <div>
                        <div class="ruler-mark" 
                             :class="{ 'major': i % 10 === 0 }"
                             :style="`left: ${i * 50}px`"></div>
                        <div class="ruler-label" 
                             x-show="i % 10 === 0"
                             :style="`left: ${i * 50}px`"
                             x-text="i * 50"></div>
                    </div>
                </template>
            </div>
            
            <div class="ruler-vertical" x-show="imageLoaded" x-ref="rulerV">
                <template x-for="i in 100" :key="'v'+i">
                    <div>
                        <div class="ruler-mark" 
                             :class="{ 'major': i % 10 === 0 }"
                             :style="`top: ${i * 50}px`"></div>
                        <div class="ruler-label" 
                             x-show="i % 10 === 0"
                             :style="`top: ${i * 50}px`"
                             x-text="i * 50"></div>
                    </div>
                </template>
            </div>
            
            <!-- Canvas Workspace -->
            <div class="canvas-workspace">
                <!-- Upload Overlay -->
                <div class="upload-overlay" 
                     x-show="!imageLoaded || isLoadingDocument"
                     @drop.prevent="handleFileDrop($event)"
                     @dragover.prevent="isDragging = true"
                     @dragleave.prevent="isDragging = false">
                    <div class="upload-box" @click="!isLoadingDocument && $refs.fileInput.click()">
                        <i class="fas" :class="isLoadingDocument ? 'fa-spinner fa-spin' : 'fa-cloud-upload-alt'"></i>
                        <h2 x-text="isLoadingDocument ? 'Processing Document' : 'Upload Your Drawing or PDF'"></h2>
                        <p x-text="isLoadingDocument ? 'Rendering PDF pages, please wait...' : 'Drag & drop or click to select an image or PDF'"></p>
                    </div>
                </div>
                
                <!-- Canvas Wrapper -->
                <div class="canvas-wrapper" 
                 x-show="imageLoaded"
                 x-ref="canvasWrapper"
                 :style="`transform: translate(${panX}px, ${panY}px) scale(${zoom})`"
                 :class="{ 'dragging': isPanning }"
                 @mousedown="startPan($event)"
                 @mousemove="handlePan($event)"
                 @mouseup="endPan($event)"
                 @mouseleave="endPan($event)"
                 @touchstart="startPan($event)"
                 @touchmove="handlePan($event)"
                 @touchend="endPan($event)"
                 @wheel.prevent="handleZoom($event)"
                 @click="addMarker($event)">
                
                <img :src="imageSrc" 
                     class="drawing-image" 
                     x-ref="drawingImage"
                     @load="imageLoadComplete()">
                
                <!-- PNG Overlays -->
                <template x-for="overlay in pngOverlays" :key="overlay.id">
                    <div class="png-overlay"
                         :class="{ 'selected': selectedOverlay?.id === overlay.id }"
                         :style="`
                             left: ${overlay.x}px;
                             top: ${overlay.y}px;
                             width: ${overlay.width}px;
                             height: ${overlay.height}px;
                             z-index: 5;
                         `"
                         @mousedown.stop="startDragOverlay($event, overlay)"
                         @click.stop="selectOverlay(overlay)">
                        <img :src="overlay.src" alt="overlay">
                        <div class="resize-handle" @mousedown.stop="startResizeOverlay($event, overlay)"></div>
                    </div>
                </template>
                
                <!-- Text Elements -->
                <template x-for="text in textElements" :key="text.id">
                    <div class="text-element"
                         :class="{ 'selected': selectedText?.id === text.id }"
                         :style="`
                             left: ${text.x}px;
                             top: ${text.y}px;
                             font-size: ${text.fontSize}px;
                             font-weight: ${text.fontWeight};
                             color: ${text.color};
                             z-index: 6;
                         `"
                         @mousedown.stop="startDragText($event, text)"
                         @dblclick.stop="editTextElement(text)"
                         @click.stop="selectText(text)">
                        <span x-text="text.value"></span>
                    </div>
                </template>
                
                <!-- Markers -->
                <template x-for="marker in markers" :key="marker.id">
                    <div class="marker"
                         :class="[marker.shape, { 'dragging-marker': draggingMarker?.id === marker.id }]"
                         :style="`
                             left: ${marker.x}px;
                             top: ${marker.y}px;
                             width: ${markerSize}px;
                             height: ${markerSize}px;
                             border: 2px solid rgb(62,73,204);
                             color: rgb(62,73,204);
                             font-size: ${markerSize * 0.3}px;
                             transform: rotate(${marker.rotation}deg);
                             background: transparent;
                         `"
                         @mousedown.stop="startDragMarker($event, marker)"
                         @dblclick="openEditModal(marker)"
                         @contextmenu.prevent="openEditModal(marker)">
                        <span x-text="marker.value"></span>
                    </div>
                </template>
            </div>
            </div><!-- End canvas-workspace -->
            
            <!-- Zoom Controls -->
            <div class="zoom-controls" x-show="imageLoaded">
                <button class="zoom-btn" @click="zoomIn()">
                    <i class="fas fa-plus"></i>
                </button>
                <div class="zoom-level" x-text="`${Math.round(zoom * 100)}%`"></div>
                <button class="zoom-btn" @click="zoomOut()">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
        
        <!-- Marker Edit Modal -->
        <div class="modal" x-show="editingMarker" @click.self="closeEditModal()">
            <div class="modal-content">
                <div class="modal-header">Edit Marker</div>
                
                <div class="form-group">
                    <label>Value</label>
                    <input type="text" x-model="editingMarker.value">
                </div>
                
                <div class="form-group">
                    <label>Shape</label>
                    <select x-model="editingMarker.shape">
                        <option value="circle">Circle</option>
                        <option value="rectangle">Rectangle</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Rotation (0-180°)</label>
                    <input type="number" x-model.number="editingMarker.rotation" min="0" max="180" step="15">
                </div>
                
                <div class="modal-actions">
                    <button class="btn" @click="deleteMarker()">Delete</button>
                    <button class="btn" @click="closeEditModal()">Cancel</button>
                    <button class="btn btn-primary" @click="saveMarkerEdit()">Save</button>
                </div>
            </div>
        </div>
        
        <!-- Text Edit Modal -->
        <div class="modal" x-show="editingText" @click.self="editingText = null">
            <div class="modal-content">
                <div class="modal-header">Edit Text</div>
                
                <div class="form-group">
                    <label>Text</label>
                    <input type="text" x-model="editingText.value">
                </div>
                
                <div class="form-group">
                    <label>Font Size</label>
                    <input type="number" x-model.number="editingText.fontSize" min="10" max="200">
                </div>
                
                <div class="form-group">
                    <label>Font Weight</label>
                    <select x-model="editingText.fontWeight">
                        <option value="400">Normal</option>
                        <option value="500">Medium</option>
                        <option value="600">Semi-Bold</option>
                        <option value="700">Bold</option>
                        <option value="800">Extra Bold</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" x-model="editingText.color">
                </div>
                
                <div class="modal-actions">
                    <button class="btn" @click="deleteText()">Delete</button>
                    <button class="btn" @click="editingText = null">Cancel</button>
                    <button class="btn btn-primary" @click="saveTextEdit()">Save</button>
                </div>
            </div>
        </div>
        
        <!-- Download Modal -->
        <div class="modal" x-show="showDownloadModal" @click.self="closeDownloadModal()">
            <div class="modal-content">
                <div class="modal-header">Download Options</div>
                
                <div class="compression-info">
                    <div style="font-size: 13px; color: #6b7280;">
                        Format:
                        <strong style="color: #374151;" x-text="pageCount > 1 ? 'ZIP (PNG files inside)' : 'PNG'"></strong>
                    </div>
                    <div class="size-comparison">
                        <div class="size-item">
                            <div class="size-label">Current Size</div>
                            <div class="size-value" x-text="formatFileSize(downloadEstimate?.originalSize)"></div>
                        </div>
                        <div class="size-item">
                            <div class="size-label">After Compression</div>
                            <div class="size-value compressed" x-text="formatFileSize(downloadEstimate?.compressedSize)"></div>
                        </div>
                    </div>
                    <div class="savings" x-text="downloadEstimateMessage()"></div>
                </div>
                
                <div class="form-group">
                    <label>Image Compression Percentage</label>
                    <input type="range"
                           x-model.number="downloadCompressionPercent"
                           min="10"
                           max="100"
                           step="5"
                           @input="queueDownloadEstimate()"
                           style="width: 100%;">
                    <div style="text-align: center; margin-top: 6px; font-size: 14px; color: #6b7280;" x-text="`${downloadCompressionPercent}%`"></div>
                </div>
                
                <div class="modal-actions">
                    <button class="btn" @click="closeDownloadModal()">Cancel</button>
                    <button class="btn btn-primary" @click="finalizeDownload()" :disabled="isPreparingDownload || !preparedDownloadPackage">
                        <span x-text="isPreparingDownload ? 'Calculating...' : 'Download'"></span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Hidden Inputs -->
        <input type="file" x-ref="fileInput" accept="image/*,.pdf,application/pdf" @change="handleFileUpload($event)">
        <input type="file" x-ref="coordsInput" accept=".json" @change="handleCoordinatesUpload($event)">
        <input type="file" x-ref="pngOverlayInput" accept="image/png" @change="handlePngOverlayUpload($event)">
    </div>
    
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
        
        function drawingApp() {
            return {
                // State
                imageLoaded: false,
                imageSrc: null,
                markers: [],
                pngOverlays: [],
                textElements: [],
                pages: [],
                currentPageIndex: 0,
                documentName: 'drawing',
                numberingMode: 'continuous',
                nextIntegerMarker: 1,
                markerSize: 40,
                isLoadingDocument: false,
                isExporting: false,
                showDownloadModal: false,
                downloadCompressionPercent: 100,
                downloadEstimate: null,
                downloadOriginalPackage: null,
                preparedDownloadPackage: null,
                isPreparingDownload: false,
                downloadEstimateRequestId: 0,
                downloadEstimateTimer: null,
                
                // Pan & Zoom
                zoom: 1,
                panX: 0,
                panY: 0,
                isPanning: false,
                lastPanX: 0,
                lastPanY: 0,
                panStartX: 0,
                panStartY: 0,
                hasPanned: false,
                
                // Drag & Drop
                isDragging: false,
                
                // Editing
                editingMarker: null,
                editingText: null,
                selectedOverlay: null,
                selectedText: null,
                addTextMode: false,
                
                // Marker Dragging
                draggingMarker: null,
                markerDragOffsetX: 0,
                markerDragOffsetY: 0,
                wasMarkerDragging: false,
                
                // PNG Overlay
                draggingOverlay: null,
                overlayDragOffsetX: 0,
                overlayDragOffsetY: 0,
                resizingOverlay: null,
                
                // Text Dragging
                draggingText: null,
                textDragOffsetX: 0,
                textDragOffsetY: 0,
                
                // History
                history: [],
                historyIndex: -1,
                
                get canUndo() {
                    return this.historyIndex > 0;
                },
                
                get canRedo() {
                    return this.historyIndex < this.history.length - 1;
                },
                
                get pageCount() {
                    return this.pages.length;
                },
                
                get currentPageNumber() {
                    return this.currentPageIndex + 1;
                },
                
                get hasAnnotationsOnCurrentPage() {
                    return this.markers.length > 0 || this.pngOverlays.length > 0 || this.textElements.length > 0;
                },
                
                get hasAnnotationsInDocument() {
                    if (!this.pages.length) {
                        return this.hasAnnotationsOnCurrentPage;
                    }
                    
                    return this.pages.some((page) => {
                        const markerCount = Array.isArray(page.markers) ? page.markers.length : 0;
                        const overlayCount = Array.isArray(page.pngOverlays) ? page.pngOverlays.length : 0;
                        const textCount = Array.isArray(page.textElements) ? page.textElements.length : 0;
                        return markerCount > 0 || overlayCount > 0 || textCount > 0;
                    });
                },
                
                createId(prefix = 'id') {
                    return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                },
                
                deepClone(value) {
                    return JSON.parse(JSON.stringify(value));
                },
                
                createPage(imageSrc = null, index = 0) {
                    return {
                        id: this.createId(`page-${index + 1}`),
                        imageSrc,
                        markers: [],
                        pngOverlays: [],
                        textElements: [],
                        nextIntegerMarker: 1
                    };
                },
                
                normalizePage(page, index) {
                    const markers = Array.isArray(page.markers) ? this.deepClone(page.markers) : [];
                    const pngOverlays = Array.isArray(page.pngOverlays) ? this.deepClone(page.pngOverlays) : [];
                    const textElements = Array.isArray(page.textElements) ? this.deepClone(page.textElements) : [];
                    
                    return {
                        id: page.id || this.createId(`page-${index + 1}`),
                        imageSrc: page.imageSrc || page.src || null,
                        markers,
                        pngOverlays,
                        textElements,
                        nextIntegerMarker: Number.isFinite(page.nextIntegerMarker)
                            ? page.nextIntegerMarker
                            : this.calculateNextIntegerForMarkers(markers)
                    };
                },
                
                resetViewportOnly() {
                    this.zoom = 1;
                    this.panX = 0;
                    this.panY = 0;
                    this.isPanning = false;
                    this.hasPanned = false;
                },
                
                clearDocumentState(resetHistory = false) {
                    this.imageLoaded = false;
                    this.imageSrc = null;
                    this.pages = [];
                    this.currentPageIndex = 0;
                    this.markers = [];
                    this.pngOverlays = [];
                    this.textElements = [];
                    this.nextIntegerMarker = 1;
                    this.selectedOverlay = null;
                    this.selectedText = null;
                    this.editingMarker = null;
                    this.editingText = null;
                    this.closeDownloadModal();
                    this.cancelTextMode();
                    this.resetViewportOnly();
                    
                    if (resetHistory) {
                        this.history = [];
                        this.historyIndex = -1;
                    }
                },
                
                calculateNextIntegerForMarkers(markers) {
                    const values = (markers || [])
                        .map((marker) => String(marker.value).trim())
                        .filter((value) => /^\d+$/.test(value))
                        .map((value) => parseInt(value, 10))
                        .filter((value) => Number.isInteger(value));
                    
                    return values.length ? Math.max(...values) + 1 : 1;
                },
                
                calculateGlobalNextInteger() {
                    const values = [];
                    
                    this.pages.forEach((page) => {
                        (page.markers || []).forEach((marker) => {
                            const rawValue = String(marker.value).trim();
                            if (/^\d+$/.test(rawValue)) {
                                values.push(parseInt(rawValue, 10));
                            }
                        });
                    });
                    
                    return values.length ? Math.max(...values) + 1 : 1;
                },
                
                recalculateAllNextIntegerMarkers() {
                    if (!this.pages.length) {
                        this.nextIntegerMarker = 1;
                        return;
                    }
                    
                    if (this.numberingMode === 'continuous') {
                        const next = this.calculateGlobalNextInteger();
                        this.pages.forEach((page) => {
                            page.nextIntegerMarker = next;
                        });
                        this.nextIntegerMarker = next;
                        return;
                    }
                    
                    this.pages.forEach((page, index) => {
                        page.nextIntegerMarker = this.calculateNextIntegerForMarkers(page.markers);
                        if (index === this.currentPageIndex) {
                            this.nextIntegerMarker = page.nextIntegerMarker;
                        }
                    });
                },
                
                syncCurrentPageState() {
                    const page = this.pages[this.currentPageIndex];
                    if (!page) return;
                    
                    page.imageSrc = this.imageSrc;
                    page.markers = this.deepClone(this.markers);
                    page.pngOverlays = this.deepClone(this.pngOverlays);
                    page.textElements = this.deepClone(this.textElements);
                    this.recalculateAllNextIntegerMarkers();
                },
                
                loadCurrentPageState(resetViewport = true) {
                    const page = this.pages[this.currentPageIndex];
                    if (!page) {
                        this.clearDocumentState();
                        return;
                    }
                    
                    this.imageSrc = page.imageSrc;
                    this.markers = this.deepClone(page.markers || []);
                    this.pngOverlays = this.deepClone(page.pngOverlays || []);
                    this.textElements = this.deepClone(page.textElements || []);
                    this.imageLoaded = Boolean(this.imageSrc);
                    this.selectedOverlay = null;
                    this.selectedText = null;
                    this.editingMarker = null;
                    this.editingText = null;
                    this.nextIntegerMarker = page.nextIntegerMarker || this.calculateNextIntegerForMarkers(this.markers);
                    
                    if (resetViewport) {
                        this.resetViewportOnly();
                    }
                    
                    this.$nextTick(() => {
                        if (this.imageLoaded) {
                            this.centerImageWhenReady();
                        }
                    });
                },
                
                setPages(pages, options = {}) {
                    const {
                        currentPageIndex = 0,
                        resetHistory = true,
                        resetViewport = true
                    } = options;
                    
                    const normalizedPages = pages.map((page, index) => this.normalizePage(page, index));
                    if (!normalizedPages.length) {
                        this.clearDocumentState(resetHistory);
                        return;
                    }
                    
                    this.pages = normalizedPages;
                    this.currentPageIndex = Math.min(Math.max(currentPageIndex, 0), this.pages.length - 1);
                    this.recalculateAllNextIntegerMarkers();
                    this.loadCurrentPageState(resetViewport);
                    
                    if (resetHistory) {
                        this.history = [];
                        this.historyIndex = -1;
                    }
                },
                
                async waitForDomPaint() {
                    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                },
                
                async waitForCurrentImage() {
                    await this.$nextTick();
                    
                    const image = this.$refs.drawingImage;
                    if (!image) return;
                    
                    if (image.complete && image.naturalWidth > 0) {
                        return;
                    }
                    
                    await new Promise((resolve) => {
                        const done = () => {
                            image.removeEventListener('load', done);
                            image.removeEventListener('error', done);
                            resolve();
                        };
                        
                        image.addEventListener('load', done, { once: true });
                        image.addEventListener('error', done, { once: true });
                    });
                },
                
                async centerImageWhenReady() {
                    await this.waitForCurrentImage();
                    this.imageLoadComplete();
                },
                
                imageLoadComplete() {
                    this.$nextTick(() => {
                        const wrapper = this.$refs.canvasWrapper;
                        const image = this.$refs.drawingImage;
                        if (!wrapper || !image) return;
                        
                        const container = wrapper.parentElement;
                        if (!container) return;
                        
                        this.panX = (container.offsetWidth - image.offsetWidth) / 2;
                        this.panY = (container.offsetHeight - image.offsetHeight) / 2;
                    });
                },
                
                async readFileAsDataUrl(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (event) => resolve(event.target.result);
                        reader.onerror = () => reject(new Error('Failed to read file.'));
                        reader.readAsDataURL(file);
                    });
                },
                
                // File Upload
                async handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        await this.loadDocument(file);
                    }
                    event.target.value = '';
                },
                
                async handleFileDrop(event) {
                    this.isDragging = false;
                    const file = event.dataTransfer.files[0];
                    if (file) {
                        await this.loadDocument(file);
                    }
                },
                
                async loadDocument(file) {
                    if (this.isLoadingDocument || this.isExporting) return;
                    
                    this.documentName = (file.name || 'drawing').replace(/\.[^.]+$/, '') || 'drawing';
                    
                    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) {
                        await this.loadPdf(file);
                        return;
                    }
                    
                    await this.loadImageFile(file);
                },
                
                async loadImageFile(file) {
                    this.isLoadingDocument = true;
                    
                    try {
                        const imageSrc = await this.readFileAsDataUrl(file);
                        this.setPages([this.createPage(imageSrc, 0)], {
                            currentPageIndex: 0,
                            resetHistory: true,
                            resetViewport: true
                        });
                    } catch (error) {
                        console.error('Image upload failed:', error);
                        alert('Failed to load the image file.');
                    } finally {
                        this.isLoadingDocument = false;
                    }
                },
                
                async loadPdf(file) {
                    if (!window.pdfjsLib) {
                        alert('PDF support could not be loaded. Please refresh and try again.');
                        return;
                    }
                    
                    this.isLoadingDocument = true;
                    
                    try {
                        const buffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
                        const pages = [];
                        
                        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                            const pdfPage = await pdf.getPage(pageNumber);
                            const viewport = pdfPage.getViewport({ scale: 1.5 });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d', { alpha: false });
                            
                            canvas.width = Math.ceil(viewport.width);
                            canvas.height = Math.ceil(viewport.height);
                            
                            await pdfPage.render({
                                canvasContext: context,
                                viewport
                            }).promise;
                            
                            pages.push(this.createPage(canvas.toDataURL('image/png'), pageNumber - 1));
                        }
                        
                        this.setPages(pages, {
                            currentPageIndex: 0,
                            resetHistory: true,
                            resetViewport: true
                        });
                    } catch (error) {
                        console.error('PDF upload failed:', error);
                        alert('Failed to load the PDF file.');
                    } finally {
                        this.isLoadingDocument = false;
                    }
                },
                
                async goToPage(index, options = {}) {
                    const {
                        saveCurrent = true,
                        resetViewport = true
                    } = options;
                    
                    if (index < 0 || index >= this.pages.length || index === this.currentPageIndex) {
                        return;
                    }
                    
                    if (saveCurrent) {
                        this.syncCurrentPageState();
                    }
                    
                    this.currentPageIndex = index;
                    this.loadCurrentPageState(resetViewport);
                    await this.waitForCurrentImage();
                    await this.waitForDomPaint();
                },
                
                async goToPreviousPage() {
                    await this.goToPage(this.currentPageIndex - 1);
                },
                
                async goToNextPage() {
                    await this.goToPage(this.currentPageIndex + 1);
                },
                
                handleNumberingModeChange() {
                    this.syncCurrentPageState();
                    this.recalculateAllNextIntegerMarkers();
                    const page = this.pages[this.currentPageIndex];
                    this.nextIntegerMarker = page ? page.nextIntegerMarker : 1;
                },
                
                // Add Marker
                addMarker(event) {
                    if (this.hasPanned || this.draggingMarker || this.wasMarkerDragging || 
                        this.draggingOverlay || this.draggingText ||
                        event.target.classList.contains('marker') ||
                        event.target.classList.contains('text-element') ||
                        event.target.classList.contains('png-overlay')) {
                        return;
                    }
                    
                    const wrapperRect = this.$refs.canvasWrapper.getBoundingClientRect();
                    const x = (event.clientX - wrapperRect.left) / this.zoom;
                    const y = (event.clientY - wrapperRect.top) / this.zoom;
                    
                    // If in text mode, place text at click position
                    if (this.addTextMode) {
                        this.placeTextAtPosition(x - 20, y - 12); // Offset to center
                        return;
                    }
                    
                    // Otherwise add marker
                    const marker = {
                        id: this.createId('marker'),
                        x: x - (this.markerSize / 2),
                        y: y - (this.markerSize / 2),
                        value: this.nextIntegerMarker,
                        type: 'integer',
                        shape: 'circle',
                        rotation: 0
                    };
                    
                    this.markers.push(marker);
                    this.nextIntegerMarker++;
                    this.saveToHistory();
                },
                
                // PNG Overlay
                async handlePngOverlayUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    try {
                        const src = await this.readFileAsDataUrl(file);
                        const img = new Image();
                        img.onload = () => {
                            const imgWidth = img.width > 200 ? 200 : img.width;
                            const imgHeight = (img.width > 200 ? 200 : img.width) * (img.height / img.width);
                            
                            const canvasRect = this.$refs.drawingImage.getBoundingClientRect();
                            const centerX = (canvasRect.width / 2) - (imgWidth / 2);
                            const centerY = (canvasRect.height / 2) - (imgHeight / 2);
                            
                            const overlay = {
                                id: this.createId('overlay'),
                                src,
                                x: centerX,
                                y: centerY,
                                width: imgWidth,
                                height: imgHeight
                            };
                            this.pngOverlays.push(overlay);
                            this.selectedOverlay = overlay;
                            this.saveToHistory();
                        };
                        img.src = src;
                    } catch (error) {
                        console.error('PNG overlay upload failed:', error);
                        alert('Failed to load the PNG overlay.');
                    }
                    event.target.value = '';
                },
                
                selectOverlay(overlay) {
                    this.selectedOverlay = overlay;
                    this.selectedText = null;
                },
                
                startDragOverlay(event, overlay) {
                    this.draggingOverlay = overlay;
                    this.selectedOverlay = overlay;
                    
                    const clientX = event.clientX;
                    const clientY = event.clientY;
                    const wrapperRect = this.$refs.canvasWrapper.getBoundingClientRect();
                    
                    this.overlayDragOffsetX = (clientX - wrapperRect.left) / this.zoom - overlay.x;
                    this.overlayDragOffsetY = (clientY - wrapperRect.top) / this.zoom - overlay.y;
                    
                    const handleMove = (e) => {
                        if (!this.draggingOverlay) return;
                        const rect = this.$refs.canvasWrapper.getBoundingClientRect();
                        this.draggingOverlay.x = (e.clientX - rect.left) / this.zoom - this.overlayDragOffsetX;
                        this.draggingOverlay.y = (e.clientY - rect.top) / this.zoom - this.overlayDragOffsetY;
                    };
                    
                    const handleEnd = () => {
                        if (this.draggingOverlay) {
                            this.saveToHistory();
                            this.draggingOverlay = null;
                        }
                        document.removeEventListener('mousemove', handleMove);
                        document.removeEventListener('mouseup', handleEnd);
                    };
                    
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                },
                
                startResizeOverlay(event, overlay) {
                    this.resizingOverlay = overlay;
                    const startX = event.clientX;
                    const startY = event.clientY;
                    const startWidth = overlay.width;
                    const startHeight = overlay.height;
                    const aspectRatio = startHeight / startWidth;
                    
                    const handleMove = (e) => {
                        if (!this.resizingOverlay) return;
                        const deltaX = (e.clientX - startX) / this.zoom;
                        const newWidth = Math.max(50, startWidth + deltaX);
                        this.resizingOverlay.width = newWidth;
                        this.resizingOverlay.height = newWidth * aspectRatio;
                    };
                    
                    const handleEnd = () => {
                        if (this.resizingOverlay) {
                            this.saveToHistory();
                            this.resizingOverlay = null;
                        }
                        document.removeEventListener('mousemove', handleMove);
                        document.removeEventListener('mouseup', handleEnd);
                    };
                    
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                },
                
                // Text Element
                addTextElement() {
                    this.addTextMode = true;
                    // Change cursor to indicate text mode
                    document.body.style.cursor = 'crosshair';
                },
                
                placeTextAtPosition(x, y) {
                    const text = {
                        id: this.createId('text'),
                        value: 'Text',
                        x: x,
                        y: y,
                        fontSize: 24,
                        fontWeight: '600',
                        color: '#1f2937'
                    };
                    this.textElements.push(text);
                    this.selectedText = text;
                    this.saveToHistory();
                    
                    // Exit text mode
                    this.addTextMode = false;
                    document.body.style.cursor = '';
                },
                
                cancelTextMode() {
                    if (this.addTextMode) {
                        this.addTextMode = false;
                        document.body.style.cursor = '';
                    }
                },
                
                selectText(text) {
                    this.selectedText = text;
                    this.selectedOverlay = null;
                },
                
                editTextElement(text) {
                    this.editingText = this.deepClone(text);
                },
                
                saveTextEdit() {
                    const index = this.textElements.findIndex(t => t.id === this.editingText.id);
                    if (index !== -1) {
                        this.textElements[index] = this.deepClone(this.editingText);
                        this.saveToHistory();
                    }
                    this.editingText = null;
                },
                
                deleteText() {
                    const index = this.textElements.findIndex(t => t.id === this.editingText.id);
                    if (index !== -1) {
                        this.textElements.splice(index, 1);
                        this.saveToHistory();
                    }
                    this.editingText = null;
                },
                
                startDragText(event, text) {
                    this.draggingText = text;
                    this.selectedText = text;
                    
                    const clientX = event.clientX;
                    const clientY = event.clientY;
                    const wrapperRect = this.$refs.canvasWrapper.getBoundingClientRect();
                    
                    this.textDragOffsetX = (clientX - wrapperRect.left) / this.zoom - text.x;
                    this.textDragOffsetY = (clientY - wrapperRect.top) / this.zoom - text.y;
                    
                    const handleMove = (e) => {
                        if (!this.draggingText) return;
                        const rect = this.$refs.canvasWrapper.getBoundingClientRect();
                        this.draggingText.x = (e.clientX - rect.left) / this.zoom - this.textDragOffsetX;
                        this.draggingText.y = (e.clientY - rect.top) / this.zoom - this.textDragOffsetY;
                    };
                    
                    const handleEnd = () => {
                        if (this.draggingText) {
                            this.saveToHistory();
                            this.draggingText = null;
                        }
                        document.removeEventListener('mousemove', handleMove);
                        document.removeEventListener('mouseup', handleEnd);
                    };
                    
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                },
                
                // Marker Dragging
                startDragMarker(event, marker) {
                    event.preventDefault();
                    this.draggingMarker = marker;
                    this.wasMarkerDragging = true;
                    this.isPanning = false;
                    
                    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
                    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
                    const wrapperRect = this.$refs.canvasWrapper.getBoundingClientRect();
                    
                    this.markerDragOffsetX = (clientX - wrapperRect.left) / this.zoom - marker.x;
                    this.markerDragOffsetY = (clientY - wrapperRect.top) / this.zoom - marker.y;
                    
                    const handleDragMove = (e) => {
                        if (!this.draggingMarker) return;
                        const moveX = e.touches ? e.touches[0].clientX : e.clientX;
                        const moveY = e.touches ? e.touches[0].clientY : e.clientY;
                        const rect = this.$refs.canvasWrapper.getBoundingClientRect();
                        
                        this.draggingMarker.x = (moveX - rect.left) / this.zoom - this.markerDragOffsetX;
                        this.draggingMarker.y = (moveY - rect.top) / this.zoom - this.markerDragOffsetY;
                    };
                    
                    const handleDragEnd = () => {
                        if (this.draggingMarker) {
                            this.saveToHistory();
                            this.draggingMarker = null;
                            setTimeout(() => {
                                this.wasMarkerDragging = false;
                            }, 100);
                        }
                        document.removeEventListener('mousemove', handleDragMove);
                        document.removeEventListener('mouseup', handleDragEnd);
                        document.removeEventListener('touchmove', handleDragMove);
                        document.removeEventListener('touchend', handleDragEnd);
                    };
                    
                    document.addEventListener('mousemove', handleDragMove);
                    document.addEventListener('mouseup', handleDragEnd);
                    document.addEventListener('touchmove', handleDragMove);
                    document.addEventListener('touchend', handleDragEnd);
                },
                
                // Edit Marker
                openEditModal(marker) {
                    this.editingMarker = this.deepClone(marker);
                },
                
                closeEditModal() {
                    this.editingMarker = null;
                },
                
                saveMarkerEdit() {
                    const index = this.markers.findIndex(m => m.id === this.editingMarker.id);
                    if (index !== -1) {
                        const value = String(this.editingMarker.value).trim();
                        
                        if (/^\d+$/.test(value)) {
                            this.editingMarker.type = 'integer';
                            this.editingMarker.value = parseInt(value, 10);
                        } else {
                            this.editingMarker.type = 'string';
                            this.editingMarker.value = value;
                        }
                        
                        this.markers[index] = this.deepClone(this.editingMarker);
                        this.saveToHistory();
                    }
                    this.closeEditModal();
                },
                
                recalculateNextIntegerMarker() {
                    this.syncCurrentPageState();
                },
                
                deleteMarker() {
                    const index = this.markers.findIndex(m => m.id === this.editingMarker.id);
                    if (index !== -1) {
                        this.markers.splice(index, 1);
                        this.saveToHistory();
                    }
                    this.closeEditModal();
                },
                
                clearAllMarkers() {
                    if (confirm('Clear all markers, overlays, and text on this page?')) {
                        this.markers = [];
                        this.pngOverlays = [];
                        this.textElements = [];
                        this.nextIntegerMarker = 1;
                        this.saveToHistory();
                    }
                },
                
                // History
                saveToHistory() {
                    if (!this.pages.length) return;
                    
                    this.syncCurrentPageState();
                    
                    if (this.historyIndex < this.history.length - 1) {
                        this.history = this.history.slice(0, this.historyIndex + 1);
                    }
                    
                    this.history.push({
                        pages: this.deepClone(this.pages),
                        currentPageIndex: this.currentPageIndex,
                        markerSize: this.markerSize,
                        numberingMode: this.numberingMode,
                        documentName: this.documentName
                    });
                    
                    this.historyIndex++;
                    
                    if (this.history.length > 50) {
                        this.history.shift();
                        this.historyIndex--;
                    }
                },
                
                restoreFromHistory(state) {
                    this.pages = state.pages.map((page, index) => this.normalizePage(page, index));
                    this.currentPageIndex = Math.min(state.currentPageIndex || 0, this.pages.length - 1);
                    this.markerSize = state.markerSize || this.markerSize;
                    this.numberingMode = state.numberingMode || this.numberingMode;
                    this.documentName = state.documentName || this.documentName;
                    this.recalculateAllNextIntegerMarkers();
                    this.loadCurrentPageState(false);
                },
                
                undo() {
                    if (this.canUndo) {
                        this.historyIndex--;
                        this.restoreFromHistory(this.history[this.historyIndex]);
                    }
                },
                
                redo() {
                    if (this.canRedo) {
                        this.historyIndex++;
                        this.restoreFromHistory(this.history[this.historyIndex]);
                    }
                },
                
                // Pan & Zoom
                startPan(event) {
                    if (event.type === 'mousedown' && event.button !== 0) return;
                    if (event.target.classList.contains('marker') || 
                        event.target.classList.contains('text-element') ||
                        event.target.classList.contains('png-overlay')) return;
                    
                    this.isPanning = true;
                    this.hasPanned = false;
                    
                    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
                    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
                    
                    this.lastPanX = clientX - this.panX;
                    this.lastPanY = clientY - this.panY;
                    this.panStartX = clientX;
                    this.panStartY = clientY;
                },
                
                handlePan(event) {
                    if (!this.isPanning) return;
                    event.preventDefault();
                    
                    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
                    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
                    
                    const deltaX = Math.abs(clientX - this.panStartX);
                    const deltaY = Math.abs(clientY - this.panStartY);
                    
                    if (deltaX > 5 || deltaY > 5) {
                        this.hasPanned = true;
                    }
                    
                    this.panX = clientX - this.lastPanX;
                    this.panY = clientY - this.lastPanY;
                },
                
                endPan(event) {
                    this.isPanning = false;
                },
                
                handleZoom(event) {
                    event.preventDefault();
                    const delta = event.deltaY > 0 ? -0.1 : 0.1;
                    this.zoom = Math.max(0.1, Math.min(5, this.zoom + delta));
                },
                
                zoomIn() {
                    this.zoom = Math.min(5, this.zoom + 0.2);
                },
                
                zoomOut() {
                    this.zoom = Math.max(0.1, this.zoom - 0.2);
                },
                
                // Download
                async openDownloadModal() {
                    if (!this.imageLoaded || this.isExporting || this.isLoadingDocument) {
                        return;
                    }
                    
                    this.showDownloadModal = true;
                    this.downloadCompressionPercent = 100;
                    this.downloadEstimate = null;
                    this.downloadOriginalPackage = null;
                    this.preparedDownloadPackage = null;
                    await this.updateDownloadEstimate(true);
                },
                
                closeDownloadModal() {
                    this.showDownloadModal = false;
                    this.isPreparingDownload = false;
                    this.downloadEstimate = null;
                    this.downloadOriginalPackage = null;
                    this.preparedDownloadPackage = null;
                    this.downloadEstimateRequestId++;
                    
                    if (this.downloadEstimateTimer) {
                        clearTimeout(this.downloadEstimateTimer);
                        this.downloadEstimateTimer = null;
                    }
                },
                
                queueDownloadEstimate() {
                    if (!this.showDownloadModal) {
                        return;
                    }
                    
                    if (this.downloadEstimateTimer) {
                        clearTimeout(this.downloadEstimateTimer);
                    }
                    
                    this.downloadEstimateTimer = setTimeout(() => {
                        this.updateDownloadEstimate(false);
                    }, 250);
                },
                
                async updateDownloadEstimate(includeOriginal = false) {
                    const requestId = ++this.downloadEstimateRequestId;
                    this.isPreparingDownload = true;
                    this.preparedDownloadPackage = null;
                    
                    try {
                        if (includeOriginal || !this.downloadOriginalPackage) {
                            this.downloadOriginalPackage = await this.buildDownloadPackage(100);
                            if (requestId !== this.downloadEstimateRequestId) return;
                        }
                        
                        let selectedPackage = this.downloadOriginalPackage;
                        if (this.downloadCompressionPercent < 100) {
                            selectedPackage = await this.buildDownloadPackage(this.downloadCompressionPercent);
                            if (requestId !== this.downloadEstimateRequestId) return;
                        }
                        
                        this.preparedDownloadPackage = selectedPackage;
                        this.downloadEstimate = {
                            originalSize: this.downloadOriginalPackage ? this.downloadOriginalPackage.size : 0,
                            compressedSize: selectedPackage ? selectedPackage.size : 0,
                            savings: this.downloadOriginalPackage && selectedPackage
                                ? Math.max(0, Math.round((1 - (selectedPackage.size / this.downloadOriginalPackage.size)) * 100))
                                : 0
                        };
                    } catch (error) {
                        console.error('Download estimate failed:', error);
                        if (requestId === this.downloadEstimateRequestId) {
                            alert(`Download preparation failed: ${error.message}`);
                            this.closeDownloadModal();
                        }
                    } finally {
                        if (requestId === this.downloadEstimateRequestId) {
                            this.isPreparingDownload = false;
                        }
                    }
                },
                
                downloadEstimateMessage() {
                    if (this.isPreparingDownload) {
                        return 'Calculating download size...';
                    }
                    
                    if (!this.downloadEstimate) {
                        return 'Move the slider to reduce PNG output dimensions before download.';
                    }
                    
                    if (this.downloadCompressionPercent >= 100) {
                        return 'No compression applied. Output will download at full size.';
                    }
                    
                    return `Estimated size reduction: ${this.downloadEstimate.savings}%`;
                },
                
                getRenderScaleFromCompression(percent) {
                    return Math.max(0.3, 2 * (Math.max(10, Math.min(100, percent)) / 100));
                },
                
                async buildDownloadPackage(percent) {
                    this.syncCurrentPageState();
                    const originalPageIndex = this.currentPageIndex;
                    const baseName = this.sanitizeFileName(this.documentName || 'marked-drawing');
                    const renderScale = this.getRenderScaleFromCompression(percent);
                    
                    try {
                        if (this.pages.length === 1) {
                            const canvas = await this.renderCurrentPageCanvas(renderScale);
                            const blob = await this.canvasToBlob(canvas, 'image/png');
                            return {
                                blob,
                                size: blob.size,
                                filename: `${baseName}-page-1.png`
                            };
                        }
                        
                        if (!window.JSZip) {
                            throw new Error('ZIP library is not available.');
                        }
                        
                        const zip = new window.JSZip();
                        
                        for (let index = 0; index < this.pages.length; index++) {
                            await this.goToPage(index, {
                                saveCurrent: true,
                                resetViewport: false
                            });
                            const canvas = await this.renderCurrentPageCanvas(renderScale);
                            const blob = await this.canvasToBlob(canvas, 'image/png');
                            zip.file(`${baseName}-page-${index + 1}.png`, blob);
                        }
                        
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        return {
                            blob: zipBlob,
                            size: zipBlob.size,
                            filename: `${baseName}-pages.zip`
                        };
                    } finally {
                        if (this.pages.length && this.currentPageIndex !== originalPageIndex) {
                            await this.goToPage(originalPageIndex, {
                                saveCurrent: false,
                                resetViewport: true
                            });
                        }
                    }
                },
                
                async finalizeDownload() {
                    if (this.isPreparingDownload) {
                        return;
                    }
                    
                    this.isExporting = true;
                    
                    try {
                        if (!this.preparedDownloadPackage) {
                            await this.updateDownloadEstimate(!this.downloadOriginalPackage);
                        }
                        
                        if (!this.preparedDownloadPackage) {
                            throw new Error('Download file is not ready yet.');
                        }
                        
                        this.downloadBlob(this.preparedDownloadPackage.blob, this.preparedDownloadPackage.filename);
                        this.closeDownloadModal();
                    } catch (error) {
                        console.error('Download failed:', error);
                        alert(`Download failed: ${error.message}`);
                    } finally {
                        this.isExporting = false;
                    }
                },
                
                async renderCurrentPageCanvas(renderScale = 2) {
                    const wrapper = this.$refs.canvasWrapper;
                    if (!wrapper) {
                        throw new Error('Canvas not ready.');
                    }
                    
                    const originalZoom = this.zoom;
                    const originalPanX = this.panX;
                    const originalPanY = this.panY;
                    
                    this.selectedOverlay = null;
                    this.selectedText = null;
                    this.cancelTextMode();
                    wrapper.classList.add('exporting');
                    this.zoom = 1;
                    this.panX = 0;
                    this.panY = 0;
                    
                    await this.waitForDomPaint();
                    
                    try {
                        return await html2canvas(wrapper, {
                            backgroundColor: '#ffffff',
                            scale: renderScale,
                            logging: false,
                            useCORS: true,
                            allowTaint: true,
                            imageTimeout: 30000,
                            removeContainer: false
                        });
                    } finally {
                        this.zoom = originalZoom;
                        this.panX = originalPanX;
                        this.panY = originalPanY;
                        wrapper.classList.remove('exporting');
                    }
                },
                
                canvasToBlob(canvas, type = 'image/png') {
                    return new Promise((resolve, reject) => {
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('Failed to create image output.'));
                            }
                        }, type);
                    });
                },
                
                sanitizeFileName(name) {
                    return (name || 'drawing')
                        .replace(/[<>:"/\\|?*\x00-\x1F]+/g, '-')
                        .replace(/\s+/g, '-')
                        .replace(/-+/g, '-')
                        .replace(/^-|-$/g, '') || 'drawing';
                },
                
                downloadBlob(blob, filename) {
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.click();
                    setTimeout(() => window.URL.revokeObjectURL(url), 250);
                },
                
                formatFileSize(bytes) {
                    if (!bytes) return '0 B';
                    const units = ['B', 'KB', 'MB', 'GB'];
                    let size = bytes;
                    let index = 0;
                    
                    while (size >= 1024 && index < units.length - 1) {
                        size /= 1024;
                        index++;
                    }
                    
                    return `${Math.round(size * 100) / 100} ${units[index]}`;
                },
                
                // Coordinates
                downloadCoordinates() {
                    this.syncCurrentPageState();
                    
                    const currentPage = this.pages[this.currentPageIndex] || this.createPage(null, this.currentPageIndex);
                    const payload = {
                        version: '3.0',
                        documentName: this.documentName,
                        pageCount: this.pageCount,
                        currentPageIndex: this.currentPageIndex,
                        numberingMode: this.numberingMode,
                        markerSize: this.markerSize,
                        timestamp: Date.now(),
                        pages: this.pages.map((page, index) => ({
                            pageNumber: index + 1,
                            markers: this.deepClone(page.markers || []),
                            pngOverlays: this.deepClone(page.pngOverlays || []),
                            textElements: this.deepClone(page.textElements || []),
                            nextIntegerMarker: page.nextIntegerMarker
                        })),
                        markers: this.deepClone(currentPage.markers || []),
                        pngOverlays: this.deepClone(currentPage.pngOverlays || []),
                        textElements: this.deepClone(currentPage.textElements || [])
                    };
                    
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    this.downloadBlob(blob, `${this.sanitizeFileName(this.documentName || 'markers')}-layout.json`);
                },
                
                handleCoordinatesUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            this.loadCoordinates(data);
                        } catch (error) {
                            alert('Error: Invalid layout file.');
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                },
                
                loadCoordinates(data) {
                    const hasPages = Array.isArray(data.pages) && data.pages.length > 0;
                    this.numberingMode = data.numberingMode === 'restart' ? 'restart' : 'continuous';
                    if (data.markerSize) {
                        this.markerSize = data.markerSize;
                    }
                    this.documentName = data.documentName || this.documentName;
                    
                    if (hasPages) {
                        if (!this.pages.length) {
                            const hasImages = data.pages.every((page) => page.imageSrc || page.src);
                            if (!hasImages) {
                                alert('Upload the image or PDF first, then load the layout JSON.');
                                return;
                            }
                            
                            this.setPages(data.pages.map((page) => ({
                                imageSrc: page.imageSrc || page.src || null,
                                markers: page.markers || [],
                                pngOverlays: page.pngOverlays || [],
                                textElements: page.textElements || []
                            })), {
                                currentPageIndex: Number.isInteger(data.currentPageIndex) ? data.currentPageIndex : 0,
                                resetHistory: true,
                                resetViewport: true
                            });
                        } else {
                            const pageLimit = Math.min(this.pages.length, data.pages.length);
                            
                            for (let index = 0; index < pageLimit; index++) {
                                const incomingPage = data.pages[index] || {};
                                this.pages[index].markers = this.deepClone(incomingPage.markers || []);
                                this.pages[index].pngOverlays = this.deepClone(incomingPage.pngOverlays || []);
                                this.pages[index].textElements = this.deepClone(incomingPage.textElements || []);
                            }
                            
                            if (data.pages.length > this.pages.length) {
                                const extraPages = data.pages.slice(this.pages.length);
                                const canAppendPages = extraPages.every((page) => page.imageSrc || page.src);
                                
                                if (canAppendPages) {
                                    extraPages.forEach((page, extraIndex) => {
                                        this.pages.push(this.normalizePage({
                                            imageSrc: page.imageSrc || page.src || null,
                                            markers: page.markers || [],
                                            pngOverlays: page.pngOverlays || [],
                                            textElements: page.textElements || []
                                        }, this.pages.length + extraIndex));
                                    });
                                }
                            }
                            
                            if (data.pages.length !== this.pages.length) {
                                alert('Layout loaded. Page counts differ, so only matching pages were applied.');
                            }
                            
                            const requestedPageIndex = Number.isInteger(data.currentPageIndex)
                                ? data.currentPageIndex
                                : this.currentPageIndex;
                            this.currentPageIndex = Math.min(requestedPageIndex, this.pages.length - 1);
                            this.recalculateAllNextIntegerMarkers();
                            this.loadCurrentPageState(false);
                            this.history = [];
                            this.historyIndex = -1;
                        }
                    } else {
                        if (!this.imageLoaded) {
                            alert('Upload an image or PDF before loading this layout file.');
                            return;
                        }
                        
                        this.markers = this.deepClone(data.markers || []);
                        this.pngOverlays = this.deepClone(data.pngOverlays || []);
                        this.textElements = this.deepClone(data.textElements || []);
                        this.syncCurrentPageState();
                    }
                    
                    this.saveToHistory();
                    alert('Layout loaded successfully.');
                }
            };
        }
    </script>
</body>
</html>
